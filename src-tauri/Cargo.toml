[package]
name = "tembo"
version = "0.1.0"
edition = "2021"

# The executable is "Tembo" so the Dock shows a capitalized name in dev too.
[[bin]]
name = "Tembo"
path = "src/main.rs"

[lib]
name = "tembo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# Setting the Dock icon at runtime (set_dock_icon).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
