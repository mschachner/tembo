[package]
name = "tembo"
version = "0.1.0"
edition = "2021"

# The executable is "Tembo" so the Dock shows a capitalized name in dev too.
[[bin]]
name = "Tembo"
path = "src/main.rs"

[lib]
name = "tembo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
